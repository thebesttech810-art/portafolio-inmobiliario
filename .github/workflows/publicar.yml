name: Probar y publicar

# En cada cambio a main: corre las pruebas, regenera las páginas de Google y publica la carpeta
# sitio/ en la rama gh-pages, que es la que sirve GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Las páginas generadas están al día
        run: |
          node herramientas/generar-paginas.mjs
          git diff --exit-code -- sitio/proyectos sitio/sitemap.xml sitio/index.html
      - name: Publicar sitio/ en gh-pages
        if: github.event_name != 'pull_request'
        run: |
          cd sitio
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
